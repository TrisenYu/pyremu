[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "vulture>=2.16",
]

[tool.setuptools]
packages = ["pyremu"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# https://setuptools.pypa.io/en/latest/build_meta.html
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# setup for pytest
pythonpath = "."
timeout = 10
# timeout_func_only = true
testpaths = ["tests"]
norecursedirs = [
	"vendor",
	".git",
	"to-read",
	"output",
	"__pycache__",
	".venv"
]

[tool.ruff]
indent-width = 4
line-length = 95
extend-exclude = [
    "vendor",
    "bsp",
	"build",
	"docs",
    "fn_apps",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
	"ERA",
    "N",
    "I",
    "W",
	"E701",
    "PL",
    "PERF",
	"PLC0415",
]
ignore=[
    "E731",
    "PLR2004"
]

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.lint.isort]
order-by-type = false
force-single-line = false
combine-as-imports = true
force-sort-within-sections = true
# 多行导入按字典序排
split-on-trailing-comma = true
# 分组划分: 标准库 / 第三方 / 本地项目 / 相对导入

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.vulture]
exclude = [
    "venv",
    ".venv",
	".vscode",
	".github",
	".ruff_cache",
	"bsp",
    "build",
	"dist",
	"docs",
	"examples",
	"output",
	"fn_apps",
	"vendor",
	"to-read",
    "migrations",
]
