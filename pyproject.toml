[project]
name = "pyremu"
version = "1.0.0"
description = "a riscv emulator"
readme = "docs/README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.8.0",
    "coverage==7.16.0",
    "iniconfig==2.3.0",
    "lief==1.0.0",
    "loguru==0.7.3",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "packaging==26.3",
    "pluggy==1.6.0",
    "prompt-toolkit==3.0.53",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydevicetree==0.0.13",
    "pyfdt==0.3",
    "pygments==2.21.0",
    "pylibfdt==1.7.2.post1",
    "pyparsing==3.3.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.6",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "wcwidth==0.8.3",
    "build==1.6.1",
    "pyproject-hooks==1.2.0",
    "setuptools==84.0.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
indent-width = 4
line-length = 95

[tool.ruff.lint]
select = [
    "F",
    "E",
    "N",
    "I",
    "W",
	"E701",
    "PL",
    "PERF",
	"PLC0415",
]
ignore=[
    "E731",
    "PLR2004"
]

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.lint.isort]
order-by-type = false
force-single-line = false
combine-as-imports = true
force-sort-within-sections = true
# 多行导入也按字典序排
split-on-trailing-comma = true
# 分组划分（标准库 / 第三方 / 本地项目 / 相对导入）

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
# setup for pytest
pythonpath = "."
timeout = 10
# timeout_func_only = true
testpaths = ["tests"]
norecursedirs = [
	"vendor",
	".git",
	"to-read",
	"output",
	"__pycache__",
	".venv"
]

[tool.setuptools]
packages = ["pyremu"]

# https://setuptools.pypa.io/en/latest/build_meta.html
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
